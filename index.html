<style id="css">
:root{
  --bg:#f2f2f4; --card:#ffffff; --ink:#0b0b0c; --muted:#6e6e73; --line:#ececf0; --track:#ececf0;
  --navy:#0b0b0c; --accent:#ff6a00; --accent-soft:#fff0e5; --ok:#28a745; --ok-soft:#e6f6ea;
  --red:#e0352b; --red-soft:#fdeceb; --life:#ff6a00; --life-soft:#fff0e5; --radius:20px; --seg:#e4e4e8; --segon:#0b0b0c; --segontx:#fff;
}
:root[data-theme="elemnt"]{
  --bg:#ECE6DC; --card:#F8F5F0; --ink:#1c1b1a; --muted:#7d766c; --line:#e4ddd1; --track:#e4ddd1;
  --accent:#2b2a28; --accent-soft:#e4ddd1; --life:#2b2a28; --life-soft:#e4ddd1; --seg:#e0d9cd; --segon:#2b2a28; --segontx:#F8F5F0;
}
:root[data-theme="dark"]{
  --bg:#000; --card:#121214; --ink:#f5f5f7; --muted:#8e8e93; --line:#1f1f22; --track:#26262a;
  --navy:#f5f5f7; --accent-soft:#2a1606; --ok:#30d158; --ok-soft:#0f2a17; --red:#ff453a; --red-soft:#2e1110; --life-soft:#2a1606; --seg:#1c1c1e; --segon:#f5f5f7; --segontx:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{background:var(--navy);color:#fff;margin:0 -16px 16px;padding:18px 20px 24px;border-radius:0 0 26px 26px}
header.top.life{background:#123b37}
header.top .hi{font-size:13px;opacity:.7;font-weight:500}
header.top h1{margin:4px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mode{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.mode button{background:none;color:#fff;opacity:.7;font-weight:700;font-size:13px;padding:7px 16px;border-radius:99px}
.mode button.on{background:#fff;color:var(--navy);opacity:1}
header.top.life .mode button.on{color:#123b37}
.sync{font-size:11px;opacity:.7}
.gear{background:rgba(255,255,255,.12);color:#fff;border-radius:99px;width:34px;height:34px;display:grid;place-items:center}
header.top{padding-top:calc(18px + env(safe-area-inset-top))}
body{padding-top:0!important}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted);margin-top:2px}
.tap{cursor:pointer}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.z-red{background:var(--red-soft);color:var(--red)}
.z-silver{background:#eceff3;color:#5d6676}
.z-gold{background:#fff4d6;color:#a87400}
.z-plat{background:#e6f0ff;color:#2f5fbf}
.z-dia{background:#efe7ff;color:#6a3fcf}
@media (prefers-color-scheme: dark){ .z-silver{background:#252f42;color:#c3cad6} .z-gold{background:#3a300f;color:#f3c84b} .z-plat{background:#16294a;color:#8fb3ff} .z-dia{background:#2a1d4a;color:#c2a8ff} }
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
label.f input,label.f select{margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--accent);color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;width:100%}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.life{background:var(--life)}
.btn.lifeghost{background:var(--life-soft);color:var(--life)}
.link{background:none;color:var(--accent);font-weight:700;font-size:12px;text-transform:none;letter-spacing:0;padding:0}
.lifemode .link{color:var(--life)}
.x{background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.check.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lifemode .chip.on{background:var(--life);border-color:var(--life)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lifemode .bar>i{background:var(--life)}
.bar.ok>i{background:var(--ok)!important}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:6px 0 2px;line-height:1.45}
.amt{font-weight:700;white-space:nowrap}
.overdue{color:var(--red)}
.weeks{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px;position:relative}
.weeks .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.weeks .col i{width:100%;background:var(--life);border-radius:7px 7px 3px 3px;min-height:3px}
.weeks .col i.hit{background:var(--ok)}
.weeks .col span{font-size:10px;color:var(--muted);margin-top:4px}
.target-line{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.5}
.drop{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:13px;display:block;cursor:pointer}
.drop b{color:var(--ink);display:block;font-size:14px;margin-bottom:3px}
.drop input{display:none}
.howto{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer}
.cat .nm{width:96px;font-size:13px;font-weight:600;flex:none}
.cat .track{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:99px}
.cat .a{width:70px;text-align:right;font-weight:700;font-size:13px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.wx .wxnow{display:flex;gap:14px;align-items:center}
.wxi{font-size:44px;line-height:1}.wxt{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.wxdays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center;border-top:1px solid var(--line);padding-top:12px}
.wxd{font-weight:700}
.focus{background:linear-gradient(135deg,#1f4b45,#2a7d72);color:#fff;border:0}
.focus .flabel,.word .flabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.ftitle{font-size:21px;font-weight:800;margin-top:6px;letter-spacing:-.01em}.fwhen{margin-top:4px;opacity:.9;font-weight:600}.fnote{margin-top:8px;font-size:13px;opacity:.85}
.plabel{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 2px 8px}
.pulse{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border-radius:16px;padding:12px 13px;color:#fff;min-height:104px;display:flex;flex-direction:column}
.tile.wide{grid-column:span 2;min-height:0}
.tile .tl{font-size:11px;font-weight:700;opacity:.85}.tile .tv{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:6px}.tile .tv .of{font-size:12px;opacity:.75;font-weight:600}
.tile .ts{font-size:11px;opacity:.85;margin-top:auto;padding-top:6px}.tile .bar{background:rgba(255,255,255,.25)}.tile .bar>i{background:#fff!important}
.t1{background:#2a7d72}.t2{background:#3f5ea8}.t3{background:#b4532a}.t4{background:#6b4fb3}.t5{background:#5d6676}
.word{background:linear-gradient(135deg,#d98a2b,#c2671d);color:#fff;border:0}.wq{font-size:19px;font-weight:700;line-height:1.35;margin-top:8px}.wa{margin-top:8px;font-size:13px;opacity:.9;font-weight:600}
.warn{display:block;width:100%;text-align:left;background:#f26b1d;color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.notice{background:var(--life-soft);color:var(--life);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs.life button.on{color:var(--life)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;margin-top:6px}
.sheet .acts .danger{background:var(--red-soft);color:var(--red);font-weight:700;padding:12px 16px;border-radius:12px}

/* clean premium */
html,body{font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{padding:0 16px 120px}
header.top,header.top.life{background:none;color:var(--ink);margin:0 0 6px;padding:calc(14px + env(safe-area-inset-top)) 4px 8px;border-radius:0}
.toprow{margin-bottom:22px}
.mode{background:var(--seg)}
.mode button{color:var(--muted);opacity:1;font-weight:600}
.mode button.on,header.top.life .mode button.on{background:var(--segon);color:var(--segontx)}
.sync{opacity:1;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.sync:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.18em}
.three{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.three>div{padding:14px 18px}.three>div+div{border-left:1px solid var(--line)}
.three .vv{font-size:22px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:15}
.switch{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;letter-spacing:.02em}
.gear{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.hdate{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase}
header.top h1{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:6px}
header.top h1.xl{font-size:40px}
.card{border:0;border-radius:var(--radius)}
.card h2{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.big{font-weight:700;letter-spacing:-.04em}
.stat .v{font-weight:700;letter-spacing:-.03em}
nav.tabs{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav.tabs button{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
nav.tabs button.on,nav.tabs.life button.on{color:var(--ink)}
nav.tabs button.on:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
nav.tabs button svg{stroke-width:1.7}
.chip.on,.lifemode .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{border-color:var(--line)}
input,select,textarea{background:var(--bg)}
.notice{background:var(--accent-soft);color:var(--accent)}
.sheet{background:var(--card)}
/* life home sections */
.sec{margin-top:22px}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px}
.sh h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.sh button{background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.box{background:var(--card);border-radius:20px;overflow:hidden}
.box .r{padding:16px 18px;border-top:1px solid var(--line)}
.box .r:first-child{border-top:0}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600;text-transform:uppercase}
.wxr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wxr .t{font-size:50px;font-weight:300;letter-spacing:-.05em;line-height:.95}
.wxr .d{font-size:13px;color:var(--muted);margin-top:4px}
.wdays{display:flex;gap:12px;text-align:center}
.wdays div{font-size:12px;color:var(--muted)}.wdays b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-top:2px}.wdays i{font-style:normal;display:block;font-size:15px;margin-top:2px}
.fx{display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:none}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-size:22px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}
.ring .n small{font-size:9px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.ft{font-size:16px;font-weight:600;margin-top:4px}.fs{font-size:13px;color:var(--muted);margin-top:3px}
.hero .num{font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1;margin-top:8px}
.hero .num span{font-size:28px;color:var(--muted);font-weight:500;vertical-align:top;position:relative;top:6px;margin-right:2px}
.hero .meta{font-size:13px;color:var(--muted);margin-top:8px}.hero .meta b{color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.two>div{padding:16px 18px}.two>div+div{border-left:1px solid var(--line)}
.vv{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px}.vv span{font-size:14px;color:var(--muted);font-weight:500}
.ss{font-size:12px;color:var(--muted);margin-top:3px}
.ev{display:flex;gap:16px;align-items:center}
.ev .dt{width:40px;text-align:center;flex:none}
.ev .dt small{display:block;font-size:10px;color:var(--accent);letter-spacing:.1em;font-weight:700}
.ev .dt b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ev .tt{font-size:15px;font-weight:500}
.wk{display:flex;align-items:flex-end;gap:6px;height:46px;flex:1}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.wk i{display:block;width:100%;max-width:18px;border-radius:4px;background:var(--track);min-height:3px}
.wk i.hit{background:var(--accent)}
.wk span{font-size:9px;color:var(--muted);margin-top:4px;font-weight:600}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.wq{font-size:20px;font-weight:400;line-height:1.38;letter-spacing:-.01em;margin-top:10px}
.wq:before{content:"\201C";color:var(--accent);font-size:42px;font-weight:600;display:block;line-height:.6;margin-bottom:4px}
.wa{font-size:13px;color:var(--muted);margin-top:12px;font-weight:500}
</style>

function csvRows(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=ch; }
    else if(ch=='"') q=true; else if(ch==','){row.push(f);f=''} else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&text[i+1]=='\n')i++; row.push(f);f=''; if(row.some(function(c){return c.trim()}))rows.push(row); row=[] } else f+=ch;
  }
  row.push(f); if(row.some(function(c){return c.trim()}))rows.push(row); return rows;
}
function toISO(s){var m=String(s).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(!m)return null; var y=+m[3]; if(y<100)y+=2000; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
function num(s){if(s==null)return NaN; s=String(s).replace(/[$,\s]/g,''); if(s==='')return NaN; return parseFloat(s)}
function merchantKey(d){return String(d).toLowerCase().replace(/(card xx\d+|value date:.*|\d{2}\/\d{2}(\/\d{2,4})?|aus|au\b|ns\b|vic\b|melbourne|richmond|geelong)/g,' ').replace(/[^a-z& ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ')}
function categorise(desc,amt){
  var k=merchantKey(desc); if(S.rules[k]) return S.rules[k];
  var d=' '+String(desc).toLowerCase().replace(/[*_]/g,' ').replace(/\s+/g,' ')+' ';
  for(var i=0;i<CAT_NAMES.length;i++){var n=CAT_NAMES[i]; if(n=='Pay'&&amt<0)continue; if(CATS[n].k.some(function(w){return d.indexOf(w)>=0}))return n;}
  return 'Other';
}
function importCSV(text){
  var rows=csvRows(text); if(!rows.length) return 'That file looks empty.';
  var map=null, h=rows[0].map(function(c){return c.toLowerCase().trim()});
  if(!toISO(rows[0][0])){
    var fi=function(re){for(var i=0;i<h.length;i++) if(re.test(h[i])) return i; return -1};
    map={date:fi(/date/),desc:fi(/desc|narr|detail|transaction|particular|memo/),amt:fi(/^amount|^amt/),deb:fi(/debit|withdraw/),cred:fi(/credit|deposit/)};
    rows=rows.slice(1);
  }
  var added=0, skipped=0, seen={};
  S.tx.forEach(function(t){seen[t.date+'|'+t.amt+'|'+t.desc]=1});
  rows.forEach(function(r){
    var date,desc,amt;
    if(map){ date=toISO(r[map.date]); desc=(r[map.desc]||'').trim();
      if(map.amt>=0) amt=num(r[map.amt]); else { var de=num(r[map.deb]), cr=num(r[map.cred]); amt=(isNaN(cr)?0:Math.abs(cr))-(isNaN(de)?0:Math.abs(de)); } }
    else { date=toISO(r[0]); amt=num(r[1]); desc=(r[2]||'').trim(); }
    if(!date||isNaN(amt)||!desc){skipped++;return}
    amt=Math.round(amt*100)/100; var key=date+'|'+amt+'|'+desc;
    if(seen[key]){skipped++;return} seen[key]=1;
    S.tx.push({id:uid(),date:date,amt:amt,desc:desc,cat:categorise(desc,amt)}); added++;
  });
  S.tx.sort(function(a,b){return a.date<b.date?1:-1});
  return added?('Imported '+added+' transaction'+(added==1?'':'s')+(skipped?' ('+skipped+' already there or skipped)':'')+'.'):'No new transactions found in that file.';
}

    return Promise.all(ps); })
  .then(function(pages){

    function grab(re){var m=t.match(re);return m?num(m[1]):''}
    var net=grab(/net\s*(?:pay|payment|amount|income)?[^0-9$]{0,25}\$?\s*([\d,]+\.\d{2})/i);

  if(ds.recruit) return recruitSheet((S.recruits||[]).find(function(x){return x.id==ds.recruit}));
  if(ds.advance){ var rr=(S.recruits||[]).find(function(x){return x.id==ds.advance}); var ni=STAGES.indexOf(rr.stage)+1; if(ni<8){ setStage(rr,STAGES[ni]); save(); render(); } return; }
  if(ds.editday) return dayLogSheet(S.days.find(function(x){return x.id==ds.editday}));
  if(ds.delInbox){ S.inbox=S.inbox.filter(function(x){return x.id!=ds.delInbox}); save(); return render(); }
  if('savings' in ds) return savingsSheet();
  if(ds.task){var t=S.tasks.find(function(x){return x.id==ds.task}); t.done=!t.done; save(); return render();}
  if(ds.delTask){S.tasks=S.tasks.filter(function(x){return x.id!=ds.delTask}); save(); return render();}
  if(ds.delDay){S.days=S.days.filter(function(x){return x.id!=ds.delDay}); save(); return render();}
  if(ds.pay){var b=S.bills.find(function(x){return x.id==ds.pay});
    if(b.freq&&b.freq!='once'&&!b.paid){ b.lastPaid=iso(); b.due=addCycle(b.due,b.freq); flash=b.name+' paid. Next due '+fmtDate(b.due)+'.'; }
    else b.paid=!b.paid; save(); return render();}
  if(ds.acc) return accSheet(S.accounts.find(function(x){return x.id==ds.acc}));
  if(ds.editBill) return billSheet(S.bills.find(function(x){return x.id==ds.editBill}));
  if(ds.week) return incomeSheet(weeklyPay().find(function(x){return x.week==ds.week}));
  if(ds.editGoal) return goalSheet(S.goals.find(function(x){return x.id==ds.editGoal}));
  if(ds.area){areaFilter=ds.area; return render();}
  if(ds.range){spendRange=ds.range; return render();}
  if(ds.cat){catOpen=catOpen==ds.cat?null:ds.cat; return render();}
  if(ds.tx) return txSheet(S.tx.find(function(x){return x.id==ds.tx}));
  if('clearDone' in ds){var areas=isLife()?LIFE_AREAS:WORK_AREAS; S.tasks=S.tasks.filter(function(t){return !(t.done&&areas.indexOf(t.area)>=0&&(areaFilter=='All'||t.area==areaFilter))}); save(); return render();}
  if('editTarget' in ds) return sheet('Weekly pay target','',[{name:'t',label:'Target $ per week',type:'number',value:S.incomeTarget}],function(d){S.incomeTarget=+d.t||0});
  if(ds.add=='bill') return billSheet(); if(ds.add=='income') return incomeSheet(); if(ds.add=='goal') return goalSheet(); if(ds.add=='recruit') return recruitSheet(); if(ds.add=='account') return accSheet();
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1); if(WORK_TABS.concat(LIFE_TABS).indexOf(h)>=0 && h!=tab){tab=h;render();}});
render();
pull();
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') pull(); });
if(!SYNC.key){ setTimeout(settingsSheet,400); }
})();
</script>
</body>
</html>
